
name: Construire NicoGPS Google Maps Android Auto

on:
  workflow_dispatch:
  push:
    branches: [principal, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Vérifier la clé Google Maps
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "ERREUR : secret GOOGLE_MAPS_API_KEY absent."
            exit 1
          fi
          echo "Clé Google Maps détectée."

      - name: Trouver le projet Android
        id: project
        run: |
          PROJECT_DIR=$(find . -type f -name settings.gradle -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : settings.gradle introuvable."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Préparer AndroidX et la clé Maps
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          GOOGLE_MAPS_API_KEY: ${{
