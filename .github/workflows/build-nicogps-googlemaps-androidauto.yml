name: NicoGPS — Migration Navigation SDK 7.9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier la clé Google
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          test -n "$GOOGLE_MAPS_API_KEY" || { echo "Secret GOOGLE_MAPS_API_KEY absent"; exit 1; }

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Trouver et extraire NicoGPS 6.2.1
        shell: bash
        run: |
          set -e
          ZIP=$(find . -type f -iname "*6.2.1*.zip" -print -quit)
          test -n "$ZIP" || { echo "Aucun ZIP 6.2.1 trouvé"; find . -type f -name "*.zip"; exit 1; }
          echo "Source sélectionnée: $ZIP"
          mkdir -p _nicogps_source
          unzip -q "$ZIP" -d _nicogps_source

      - name: Trouver le projet Android
        shell: bash
        run: |
          set -e
          SETTINGS=$(find _nicogps_source -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          test -n "$SETTINGS" || { echo "settings.gradle introuvable"; exit 1; }
          ROOT=$(dirname "$SETTINGS")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Projet: $ROOT"

      - name: AndroidX
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          touch gradle.properties
          grep -q '^android.useAndroidX=' gradle.properties \
            && sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties \
            || echo 'android.useAndroidX=true' >> gradle.properties
          grep -q '^android.enableJetifier=' gradle.properties \
            && sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties \
            || echo 'android.enableJetifier=true' >> gradle.properties

      - name: Migrer Maps SDK vers Navigation SDK 7.9.0
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e
          APP_GRADLE=$(find . -maxdepth 3 -type f -name "build.gradle" -path "*/app/*" -print -quit)
          test -n "$APP_GRADLE" || { echo "app/build.gradle introuvable"; exit 1; }

          sed -i '/com\.google\.android\.gms:play-services-maps/d' "$APP_GRADLE"

          if ! grep -q 'com.google.android.libraries.navigation:navigation:7.9.0' "$APP_GRADLE"; then
            sed -i '/dependencies[[:space:]]*{/a\    implementation '\''com.google.android.libraries.navigation:navigation:7.9.0'\''' "$APP_GRADLE"
          fi

          if ! grep -q 'desugar_jdk_libs_nio' "$APP_GRADLE"; then
            sed -i '/dependencies[[:space:]]*{/a\    coreLibraryDesugaring '\''com.android.tools:desugar_jdk_libs_nio:2.1.5'\''' "$APP_GRADLE"
          fi

          if ! grep -q 'annotationProcessor.*androidx.annotation:annotation' "$APP_GRADLE"; then
            sed -i '/dependencies[[:space:]]*{/a\    annotationProcessor '\''androidx.annotation:annotation:1.7.0'\''' "$APP_GRADLE"
          fi

          sed -i -E 's/minSdk(V|e)rsion[[:space:]]+[0-9]+/minSdkVersion 24/g' "$APP_GRADLE"
          sed -i -E 's/targetSdk(V|e)rsion[[:space:]]+[0-9]+/targetSdkVersion 36/g' "$APP_GRADLE"

          if ! grep -q 'coreLibraryDesugaringEnabled' "$APP_GRADLE"; then
            sed -i '/android[[:space:]]*{/a\
              compileOptions {\
                  coreLibraryDesugaringEnabled true\
                  sourceCompatibility JavaVersion.VERSION_17\
                  targetCompatibility JavaVersion.VERSION_17\
              }' "$APP_GRADLE"
          fi

          ROOT_GRADLE=$(find . -maxdepth 2 -type f -name "build.gradle" -print -quit)
          if [ -n "$ROOT_GRADLE" ] && ! grep -q 'play-services-maps' "$ROOT_GRADLE"; then
            cat >> "$ROOT_GRADLE" <<'EOF'

allprojects {
    configurations.configureEach {
        exclude group: 'com.google.android.gms', module: 'play-services-maps'
    }
}
EOF
          fi

          grep -q 'com.google.android.libraries.navigation:navigation:7.9.0' "$APP_GRADLE"
          ! grep -q 'com.google.android.gms:play-services-maps' "$APP_GRADLE"

      - name: Injecter la clé API
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        shell: bash
        run: |
          set -e
          MANIFEST=$(find . -type f -path "*/src/main/AndroidManifest.xml" -print -quit)
          test -n "$MANIFEST" || { echo "Manifest introuvable"; exit 1; }

          python3 - "$MANIFEST" <<'PY'
import re, sys
from pathlib import Path
p = Path(sys.argv[1])
s = p.read_text(encoding="utf-8")
meta = '<meta-data android:name="com.google.android.geo.API_KEY" android:value="${MAPS_API_KEY}" />'
s = re.sub(r'<meta-data\s+android:name="com\.google\.android\.geo\.API_KEY"\s+android:value="[^"]*"\s*/>', meta, s)
if 'com.google.android.geo.API_KEY' not in s:
    s = s.replace('</application>', '    ' + meta + '\n</application>')
p.write_text(s, encoding="utf-8")
PY

          printf 'MAPS_API_KEY=%s\n' "$GOOGLE_MAPS_API_KEY" > local.properties

      - name: Vérifier Android Auto
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          MANIFEST=$(find . -type f -path "*/src/main/AndroidManifest.xml" -print -quit)
          grep -q 'androidx.car.app.category.NAVIGATION' "$MANIFEST" || echo "AVERTISSEMENT: catégorie Android Auto NAVIGATION absente."
          find . -type f \( -name "NicoGPSCarService.java" -o -name "automotive_app_desc.xml" \) -print

      - name: Compiler NicoGPS
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Vérifier et publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-Navigation-7.9-AndroidAuto
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/**/*.apk
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/*.apk
          if-no-files-found: error
