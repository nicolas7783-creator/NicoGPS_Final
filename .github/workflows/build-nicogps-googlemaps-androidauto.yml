name: NicoGPS - Navigation SDK 7.9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Verifier la cle Google
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "ERREUR : secret GOOGLE_MAPS_API_KEY absent"
            exit 1
          fi

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Trouver le source NicoGPS 6.2.1
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -iname "*6.2.1*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun ZIP 6.2.1 trouve"
            echo "ZIP disponibles :"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "Source selectionnee : $ZIP"

          mkdir -p _nicogps_source
          unzip -q "$ZIP" -d _nicogps_source

      - name: Trouver le projet Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find _nicogps_source -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : settings.gradle introuvable"
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo "Projet Android : $ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Activer AndroidX
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          touch gradle.properties

          if grep -q "^android.useAndroidX=" gradle.properties; then
            sed -i "s/^android.useAndroidX=.*/android.useAndroidX=true/" gradle.properties
          else
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if grep -q "^android.enableJetifier=" gradle.properties; then
            sed -i "s/^android.enableJetifier=.*/android.enableJetifier=true/" gradle.properties
          else
            echo "android.enableJetifier=true" >> gradle.properties
          fi

      - name: Migrer vers Navigation SDK 7.9.0
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          APP_GRADLE=$(find . -type f -path "*/app/build.gradle" -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERREUR : app/build.gradle introuvable"
            exit 1
          fi

          echo "Fichier Gradle : $APP_GRADLE"

          sed -i "/play-services-maps/d" "$APP_GRADLE"

          if ! grep -q "com.google.android.libraries.navigation:navigation" "$APP_GRADLE"; then
            sed -i "/dependencies[[:space:]]*{/a\    implementation 'com.google.android.libraries.navigation:navigation:7.9.0'" "$APP_GRADLE"
          fi

          echo "Dependances Navigation :"
          grep -n "navigation:" "$APP_GRADLE" || true

          if grep -q "play-services-maps" "$APP_GRADLE"; then
            echo "ERREUR : ancienne dependance Maps encore presente"
            exit 1
          fi

      - name: Verifier Android Auto
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          echo "Recherche des composants Android Auto..."

          find . -type f \
            \( -name "NicoGPSCarService.java" \
            -o -name "automotive_app_desc.xml" \
            -o -name "AndroidManifest.xml" \) \
            -print

      - name: Afficher les references Maps
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          echo "References Maps presentes dans le code :"

          grep -RIn \
            --include="*.java" \
            --include="*.kt" \
            "com.google.android.gms.maps" \
            app/src 2>/dev/null || true

      - name: Compiler NicoGPS
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew clean assembleDebug --stacktrace

      - name: Verifier APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          echo "APK generees :"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK genere"
            exit 1
          fi

          echo "APK trouve : $APK"

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-Navigation-7.9-AndroidAuto
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/**/*.apk
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/*.apk
          if-no-files-found: error
