name: Construire NicoGPS Navigation 7.9 Android Auto

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:

      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Vérifier la clé Google Maps
        shell: bash
        run: |
          set -e

          if [ -z "$MAPS_API_KEY" ]; then
            echo "ERREUR : secret GOOGLE_MAPS_API_KEY absent."
            exit 1
          fi

          echo "Clé Google Maps détectée."

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Trouver et extraire le source NicoGPS
        shell: bash
        run: |
          set -e

          echo "Recherche du source NicoGPS 6.2.1..."

          ZIP=$(find . -type f -iname "*6.2.1*Google*Maps*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -type f -iname "*6.2.1*.zip" -print -quit)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERREUR : source NicoGPS 6.2.1 introuvable."
            echo ""
            echo "ZIP disponibles dans le dépôt :"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "======================================"
          echo "SOURCE TROUVÉE :"
          echo "$ZIP"
          echo "======================================"

          rm -rf nicogps_source
          mkdir -p nicogps_source

          unzip -o "$ZIP" -d nicogps_source

          echo "Source décompressée."

      - name: Trouver le projet Android
        shell: bash
        run: |
          set -e

          echo "Recherche de settings.gradle..."

          SETTINGS=$(find nicogps_source -type f -name "settings.gradle" -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find nicogps_source -type f -name "settings.gradle.kts" -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : settings.gradle introuvable après extraction."
            echo ""
            echo "Fichiers trouvés dans la source :"
            find nicogps_source -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "======================================"
          echo "PROJET ANDROID TROUVÉ :"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Vérifier les fichiers Android
        shell: bash
        run: |
          set -e

          echo "Projet utilisé : $PROJECT_DIR"

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "app/build.gradle trouvé."
          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts trouvé."
          else
            echo "ERREUR : fichier Gradle de l'application introuvable."

            echo ""
            echo "Contenu du projet :"
            find "$PROJECT_DIR" -maxdepth 4 -type f | sort

            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERREUR : AndroidManifest.xml introuvable."
            exit 1
          fi

          echo "Structure Android valide."

      - name: Activer AndroidX
        shell: bash
        run: |
          set -e

          touch "$PROJECT_DIR/gradle.properties"

          grep -q '^android.useAndroidX=true' \
            "$PROJECT_DIR/gradle.properties" || \
            echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"

          grep -q '^android.enableJetifier=true' \
            "$PROJECT_DIR/gradle.properties" || \
            echo 'android.enableJetifier=true' >> "$PROJECT_DIR/gradle.properties"

          echo "AndroidX activé."

      - name: Déterminer le fichier Gradle
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "APP_GRADLE=$PROJECT_DIR/app/build.gradle" >> "$GITHUB_ENV"
          else
            echo "APP_GRADLE=$PROJECT_DIR/app/build.gradle.kts" >> "$GITHUB_ENV"
          fi

          echo "Fichier Gradle sélectionné."

      - name: Vérifier Navigation SDK
        shell: bash
        run: |
          set -e

          echo "Fichier analysé : $APP_GRADLE"

          if ! grep -q "com.google.android.libraries.navigation:navigation" "$APP_GRADLE"; then
            echo "ERREUR : Navigation SDK Google non détecté."
            echo ""
            echo "Dépendances trouvées :"
            grep -n "implementation" "$APP_GRADLE" || true
            exit 1
          fi

          if grep -q "play-services-maps" "$APP_GRADLE"; then
            echo "ERREUR : play-services-maps détecté."
            echo "Le projet doit utiliser le Navigation SDK."
            exit 1
          fi

          echo "Navigation SDK Google détecté."

      - name: Injecter la clé Google Maps
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" "$MAPS_API_KEY" <<'PY'
          import sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          key = sys.argv[2]

          text = manifest.read_text(encoding="utf-8")

          text = text.replace("${MAPS_API_KEY}", key)
          text = text.replace("${GOOGLE_MAPS_API_KEY}", key)

          manifest.write_text(text, encoding="utf-8")

          print("Clé Google Maps injectée.")
          PY

      - name: Vérifier Android Auto
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          DESC=$(find "$PROJECT_DIR" \
            -type f \
            -name "automotive_app_desc.xml" \
            -print -quit)

          if [ -z "$DESC" ]; then
            echo "ERREUR : automotive_app_desc.xml introuvable."
            exit 1
          fi

          echo "Description Android Auto trouvée : $DESC"

          if ! grep -q "androidx.car.app.category.NAVIGATION" "$MANIFEST"; then
            echo "ERREUR : catégorie Android Auto NAVIGATION absente."
            exit 1
          fi

          if ! grep -q "com.google.android.gms.car.application" "$MANIFEST"; then
            echo "ERREUR : déclaration Android Auto absente."
            exit 1
          fi

          echo "Android Auto détecté."

      - name: Vérifier NavigationViewForAuto
        shell: bash
        run: |
          set -e

          if grep -R -q "NavigationViewForAuto" \
            "$PROJECT_DIR/app/src/main/java"; then

            echo "NavigationViewForAuto détecté."

          else

            echo "AVERTISSEMENT : NavigationViewForAuto non trouvé."
            echo "Le build continue pour obtenir le diagnostic complet."

          fi

      - name: Vérifier Android SDK
        shell: bash
        run: |
          set -e

          if grep -q "compileSdk 36" "$APP_GRADLE"; then
            echo "compileSdk 36 détecté."
          elif grep -
