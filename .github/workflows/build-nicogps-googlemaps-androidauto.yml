name: Construire NicoGPS 7.9 Navigation Google Android Auto FIX2

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GOOGLE_MAPS_API_KEY: "${{ secrets.GOOGLE_MAPS_API_KEY }}"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Vérifier la clé Google Maps
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "ERREUR : secret GOOGLE_MAPS_API_KEY absent."
            exit 1
          fi
          echo "Clé Google Maps détectée."

      - name: Trouver la source NicoGPS FIX1
        id: source
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 3 -type f -name 'NicoGPS_FULL_7.9_GOOGLE_NAVIGATION_ANDROID_AUTO_FIX1.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : ZIP FIX1 introuvable."
            find . -maxdepth 3 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Source : $ZIP"

          rm -rf build-source
          mkdir build-source

          unzip -q "$ZIP" -d build-source

          echo "project_dir=build-source" >> "$GITHUB_OUTPUT"

      - name: Vérifier et nettoyer gradle.properties
        working-directory: build-source
        run: |
          touch gradle.properties

          sed -i '/^[[:space:]]*android\.useDeprecatedNdk[[:space:]]*=/d' gradle.properties

          grep -q '^android.useAndroidX=true' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties

          grep -q '^android.enableJetifier=true' gradle.properties || \
            echo 'android.enableJetifier=true' >> gradle.properties

          echo '--- gradle.properties ---'
          cat gradle.properties

      - name: Vérifier Navigation SDK
        working-directory: build-source
        run: |
          grep -q 'navSdkVersion = "7.9.0"' app/build.gradle

          grep -q 'com.google.android.libraries.navigation:navigation:' app/build.gradle

          ! grep -q 'android.useDeprecatedNdk' gradle.properties

          ! grep -q 'play-services-maps' app/build.gradle

          echo "Navigation SDK 7.9.0 détecté."

      - name: Injecter la clé Google Maps
        working-directory: build-source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path('app/src/main/AndroidManifest.xml')

          s = p.read_text(encoding='utf-8')

          key = os.environ['GOOGLE_MAPS_API_KEY']

          s = s.replace('${MAPS_API_KEY}', key)

          p.write_text(s, encoding='utf-8')

          print('Clé Google Maps injectée.')
          PY

      - name: Vérifier Android Auto
        working-directory: build-source
        run: |
          test -f app/src/main/res/xml/automotive_app_desc.xml

          grep -q 'androidx.car.app.category.NAVIGATION' \
            app/src/main/AndroidManifest.xml

          grep -q 'com.google.android.gms.car.application' \
            app/src/main/AndroidManifest.xml

          grep -q 'NavigationViewForAuto' \
            app/src/main/java/com/nicogps/app/NicoGPSCarService.java

          echo "Android Auto détecté."

      - name: Construire APK debug
        working-directory: build-source
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Vérifier APK et SHA-1
        working-directory: build-source
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          echo "APK : $APK"

          keytool -printcert -jarfile "$APK" \
            | grep -E 'Owner:|SHA1:|SHA256:' || true

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-7.9-Navigation-AndroidAuto-FIX2
          path: build-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
