name: Construire NicoGPS Navigation 7.9 Android Auto

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:

      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Vérifier la clé Google Maps
        shell: bash
        run: |
          set -e

          if [ -z "$MAPS_API_KEY" ]; then
            echo "ERREUR : secret GOOGLE_MAPS_API_KEY absent."
            exit 1
          fi

          echo "Clé Google Maps détectée."

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Trouver et extraire le source NicoGPS
        shell: bash
        run: |
          set -e

          echo "Recherche du source NicoGPS..."

          ZIP=""

          for pattern in \
            "NicoGPS-6.2.1-Google-Maps-FINAL*.zip" \
            "NicoGPS6.2.1_GoogleMaps_fix_build*.zip" \
            "NicoGPS6.2.1*GoogleMaps*.zip"
          do
            ZIP=$(find . -type f -iname "$pattern" -print -quit)
            if [ -n "$ZIP" ]; then
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "ERREUR : source NicoGPS 6.2.1 introuvable."
            echo ""
            echo "ZIP disponibles dans le dépôt :"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "SOURCE TROUVÉE : $ZIP"

          rm -rf nicogps_source
          mkdir -p nicogps_source

          unzip -o "$ZIP" -d nicogps_source

          echo "Source décompressée."

      - name: Trouver le projet Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find nicogps_source -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : settings.gradle introuvable après extraction."
            echo ""
            echo "Fichiers trouvés :"
            find nicogps_source -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projet Android trouvé : $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Vérifier les fichiers Android
        shell: bash
        run: |
          set -e

          echo "Projet : $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then

            echo "ERREUR : app/build.gradle introuvable."

            find "$PROJECT_DIR" -maxdepth 4 -type f | sort

            exit 1
          fi

          echo "Projet Android valide."

      - name: Activer AndroidX
        shell: bash
        run: |
          set -e

          touch "$PROJECT_DIR/gradle.properties"

          grep -q '^android.useAndroidX=true' \
            "$PROJECT_DIR/gradle.properties" || \
            echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"

          grep -q '^android.enableJetifier=true' \
            "$PROJECT_DIR/gradle.properties" || \
            echo 'android.enableJetifier=true' >> "$PROJECT_DIR/gradle.properties"

          echo "AndroidX activé."

      - name: Vérifier Navigation SDK
        shell: bash
        run: |
          set -e

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          fi

          echo "Fichier Gradle : $GRADLE_FILE"

          grep -q "com.google.android.libraries.navigation:navigation" "$GRADLE_FILE"

          if grep -q "play-services-maps" "$GRADLE_FILE"; then
            echo "ERREUR : play-services-maps détecté."
            exit 1
          fi

          echo "Navigation SDK détecté."

      - name: Injecter la clé Google Maps
        shell: bash
        run: |
          set -
