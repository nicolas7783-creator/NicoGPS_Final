name: Construire NicoGPS Google Maps Android Auto

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GOOGLE_MAPS_API_KEY: "${{ secrets.GOOGLE_MAPS_API_KEY }}"

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Vérifier la clé Google Maps
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "ERREUR : la clé GOOGLE_MAPS_API_KEY est absente."
            exit 1
          fi
          echo "Clé Google Maps détectée."

      - name: Chercher le projet Android
        run: |
          echo "Recherche de settings.gradle..."
          find . -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Déterminer le dossier du projet
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find . -type f -name "settings.gradle" -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : aucun settings.gradle trouvé."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Projet trouvé dans : $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Préparer AndroidX
        working-directory: "${{ steps.project.outputs.project_dir }}"
        run: |
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Injecter la clé Google Maps
        working-directory: "${{ steps.project.outputs.project_dir }}"
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          manifest = Path("app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("ERREUR : AndroidManifest.xml introuvable.")

          text = manifest.read_text(encoding="utf-8")

          key = os.environ["GOOGLE_MAPS_API_KEY"]

          text = text.replace(
              "${MAPS_API_KEY}",
              key
          )

          manifest.write_text(text, encoding="utf-8")

          print("Clé Google Maps injectée dans le manifeste.")
          PY

      - name: Vérifier Android Auto
        working-directory: "${{ steps.project.outputs.project_dir }}"
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/xml/automotive_app_desc.xml

          grep -q "androidx.car.app.category.NAVIGATION" \
            app/src/main/AndroidManifest.xml

          grep -q "com.google.android.gms.car.application" \
            app/src/main/AndroidManifest.xml

          echo "Configuration Android Auto détectée."

      - name: Construire NicoGPS
        working-directory: "${{ steps.project.outputs.project_dir }}"
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Vérifier APK
        working-directory: "${{ steps.project.outputs.project_dir }}"
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK non trouvé."
            exit 1
          fi

          echo "APK trouvé : $APK"

      - name: Afficher SHA-1
        working-directory: "${{ steps.project.outputs.project_dir }}"
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          keytool -printcert -jarfile "$APK" || true

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-GoogleMaps-AndroidAuto
          path: "${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
