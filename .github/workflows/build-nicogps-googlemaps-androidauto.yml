name: Construire NicoGPS 7.9 Google Navigation Android Auto

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Vérifier la clé Google Maps
        shell: bash
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "ERREUR : le secret GOOGLE_MAPS_API_KEY est absent."
            exit 1
          fi
          echo "Clé Google Maps détectée."

      - name: Extraire la source NicoGPS complète
        id: project
        shell: bash
        run: |
          SOURCE_ZIP=$(find . -maxdepth 3 -type f -name 'NicoGPS_FULL_7.9_GOOGLE_NAVIGATION_ANDROID_AUTO.zip' -print -quit)
          if [ -z "$SOURCE_ZIP" ]; then
            echo "ERREUR : ZIP source NicoGPS introuvable."
            echo "Fichier attendu : NicoGPS_FULL_7.9_GOOGLE_NAVIGATION_ANDROID_AUTO.zip"
            exit 1
          fi
          rm -rf build-source
          mkdir -p build-source
          unzip -q "$SOURCE_ZIP" -d build-source
          test -f build-source/settings.gradle
          echo "project_dir=build-source" >> "$GITHUB_OUTPUT"
          echo "Source extraite dans build-source."

      - name: Vérifier la configuration Navigation SDK
        working-directory: build-source
        shell: bash
        run: |
          grep -q 'com.google.android.libraries.navigation:navigation:' app/build.gradle
          grep -q 'navSdkVersion = "7.9.0"' app/build.gradle
          grep -q 'compileSdk 36' app/build.gradle
          grep -q 'targetSdk 36' app/build.gradle
          grep -q 'android.useDeprecatedNdk=true' gradle.properties
          if grep -q 'play-services-maps' app/build.gradle; then
            echo "ERREUR : play-services-maps ne doit pas être déclaré directement."
            exit 1
          fi
          echo "Configuration Navigation SDK 7.9.0 OK."

      - name: Injecter la clé API dans le manifeste
        working-directory: build-source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          key = os.environ['GOOGLE_MAPS_API_KEY']

          if '${MAPS_API_KEY}' not in s:
              raise SystemExit('ERREUR : placeholder MAPS_API_KEY absent du manifeste.')

          p.write_text(s.replace('${MAPS_API_KEY}', key), encoding='utf-8')
          print('Clé Google Maps injectée.')
          PY

      - name: Vérifier Android Auto
        working-directory: build-source
        shell: bash
        run: |
          test -f app/src/main/res/xml/automotive_app_desc.xml
          grep -q 'androidx.car.app.category.NAVIGATION' app/src/main/AndroidManifest.xml
          grep -q 'com.google.android.gms.car.application' app/src/main/AndroidManifest.xml
          grep -q 'NavigationViewForAuto' app/src/main/java/com/nicogps/app/NicoGPSCarService.java
          echo "Configuration Android Auto détectée."

      - name: Construire APK debug
        working-directory: build-source
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Vérifier APK et SHA-1
        working-directory: build-source
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERREUR : APK non trouvé."
            exit 1
          fi
          echo "APK : $APK"
          keytool -printcert -jarfile "$APK" | grep -E 'Owner:|SHA1:|SHA256:' || true

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-7.9-GoogleNavigation-AndroidAuto
          path: build-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
