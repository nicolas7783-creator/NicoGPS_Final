name: NicoGPS - Navigation SDK 7.9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Verifier la cle Google
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "ERREUR : secret GOOGLE_MAPS_API_KEY absent"
            exit 1
          fi

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Trouver le source NicoGPS 6.2.1
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -iname "*6.2.1*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun ZIP 6.2.1 trouve"
            echo "ZIP disponibles :"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "Source selectionnee : $ZIP"

          mkdir -p _nicogps_source
          unzip -q "$ZIP" -d _nicogps_source

      - name: Trouver le projet Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find _nicogps_source -type f -name "settings.gradle" -o -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : settings.gradle introuvable"
            echo "Contenu du source :"
            find _nicogps_source -maxdepth 5 -type f | head -100
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo "Projet Android : $ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verifier la structure Android
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "=== Structure du projet ==="
          find . -maxdepth 3 -type f | sort | head -150

          if [ ! -f "app/build.gradle" ]; then
            echo "ERREUR : app/build.gradle introuvable"
            exit 1
          fi

          echo "app/build.gradle trouve."

      - name: Activer AndroidX
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          touch gradle.properties

          if grep -q "^android.useAndroidX=" gradle.properties; then
            sed -i "s/^android.useAndroidX=.*/android.useAndroidX=true/" gradle.properties
          else
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if grep -q "^android.enableJetifier=" gradle.properties; then
            sed -i "s/^android.enableJetifier=.*/android.enableJetifier=true/" gradle.properties
          else
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          echo "=== gradle.properties ==="
          cat gradle.properties

      - name: Migrer vers Navigation SDK 7.9.0
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          APP_GRADLE="app/build.gradle"

          echo "Fichier Gradle : $APP_GRADLE"

          echo "=== Avant migration ==="
          grep -nE "play-services-maps|navigation:" "$APP_GRADLE" || true

          sed -i "/play-services-maps/d" "$APP_GRADLE"

          if ! grep -q "com.google.android.libraries.navigation:navigation" "$APP_GRADLE"; then
            sed -i "/dependencies[[:space:]]*{/a\    implementation 'com.google.android.libraries.navigation:navigation:7.9.0'" "$APP_GRADLE"
          fi

          echo "=== Apres migration ==="
          grep -nE "play-services-maps|navigation:" "$APP_GRADLE" || true

          if grep -q "play-services-maps" "$APP_GRADLE"; then
            echo "ERREUR : ancienne dependance Maps encore presente"
            exit 1
          fi

          if ! grep -q "com.google.android.libraries.navigation:navigation:7.9.0" "$APP_GRADLE"; then
            echo "ERREUR : Navigation SDK 7.9.0 non ajoute"
            exit 1
          fi

      - name: Configurer la compilation Java
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          APP_GRADLE="app/build.gradle"

          if ! grep -q "sourceCompatibility" "$APP_GRADLE"; then
            sed -i '/android[[:space:]]*{/a\
              compileOptions {\
                  sourceCompatibility JavaVersion.VERSION_17\
                  targetCompatibility JavaVersion.VERSION_17\
              }' "$APP_GRADLE"
          fi

          echo "Configuration Java verifiee."

      - name: Configurer la cle Google Maps
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        shell: bash
        run: |
          set -e

          MANIFEST=$(find . -type f -path "*/src/main/AndroidManifest.xml" -print -quit)

          if [ -z "$MANIFEST" ]; then
            echo "ERREUR : AndroidManifest.xml introuvable"
            exit 1
          fi

          echo "Manifest : $MANIFEST"

          python3 - "$MANIFEST" "$GOOGLE_MAPS_API_KEY" <<'PY'
          import sys
          import re
          from pathlib import Path

          manifest = Path(sys.argv[1])
          api_key = sys.argv[2]

          text = manifest.read_text(encoding="utf-8")

          new_meta = (
              '<meta-data '
              'android:name="com.google.android.geo.API_KEY" '
              f'android:value="{api_key}" />'
          )

          pattern = (
              r'<meta-data\s+'
              r'android:name="com\.google\.android\.geo\.API_KEY"\s+'
              r'android:value="[^"]*"\s*/>'
          )

          if re.search(pattern, text):
              text = re.sub(pattern, new_meta, text)
          elif "</application>" in text:
              text = text.replace(
                  "</application>",
                  "        " + new_meta + "\n    </application>"
              )
          else:
              print("
