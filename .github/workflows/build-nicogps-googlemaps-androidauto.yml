name: Construire NicoGPS Navigation 7.9 Android Auto

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Vérifier la clé Google Maps
        shell: bash
        run: |
          set -e
          test -n "$MAPS_API_KEY"
          echo "Clé Google Maps détectée."

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Vérifier la base Navigation SDK
        shell: bash
        run: |
          set -e
          grep -q "navigation:7.9.0" app/build.gradle
          grep -q "compileSdk 36" app/build.gradle
          grep -q "targetSdk 36" app/build.gradle
          ! grep -q "play-services-maps" app/build.gradle
          grep -q "android.useAndroidX=true" gradle.properties
          echo "Base Navigation SDK 7.9.0 OK."

      - name: Construire APK debug
        run: |
          set -e
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Vérifier APK
        shell: bash
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" -print -quit)
          test -n "$APK"
          echo "APK généré : $APK"
          keytool -printcert -jarfile "$APK" || true

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-Navigation-7.9-AndroidAuto
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
