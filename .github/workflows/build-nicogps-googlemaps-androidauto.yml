name: Construire NicoGPS 7.9 Navigation Google Android Auto FIX4

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GOOGLE_MAPS_API_KEY: "${{ secrets.GOOGLE_MAPS_API_KEY }}"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Vérifier la clé Google Maps
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "ERREUR : secret GOOGLE_MAPS_API_KEY absent."
            exit 1
          fi
          echo "Clé Google Maps détectée."

      - name: Trouver et extraire la source NicoGPS FIX1
        shell: bash
        run: |
          ZIP=$(find . -type f -name 'NicoGPS_FULL_7.9_GOOGLE_NAVIGATION_ANDROID_AUTO_FIX1.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : ZIP FIX1 introuvable."
            find . -type f -name '*.zip' -print
            exit 1
          fi

          echo "Source : $ZIP"
          rm -rf build-source
          mkdir -p build-source
          unzip -q "$ZIP" -d build-source

      - name: Trouver le dossier Android
        id: project
        shell: bash
        run: |
          SETTINGS=$(find build-source -type f -name 'settings.gradle' -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : settings.gradle introuvable."
            find build-source -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Projet Android : $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Nettoyer les anciennes options Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          touch gradle.properties

          sed -i '/^[[:space:]]*android\.useDeprecatedNdk[[:space:]]*=/d' gradle.properties

          grep -q '^android.useAndroidX=true' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties

          grep -q '^android.enableJetifier=true' gradle.properties || \
            echo 'android.enableJetifier=true' >> gradle.properties

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/build.gradle')
          s = p.read_text(encoding='utf-8')

          # Supprime uniquement un bloc dexOptions simple.
          s = re.sub(
              r'(?ms)^\s*dexOptions\s*\{\s*javaMaxHeapSize\s+[\'\"]4g[\'\"]\s*\}\s*\n?',
              '',
              s,
          )

          # Supprime uniquement le vieux bloc repositories { google() } local.
          s = re.sub(
              r'(?m)^\s*repositories\s*\{\s*google\(\)\s*\}\s*\n?',
              '',
              s,
          )

          p.write_text(s, encoding='utf-8')
          PY

          echo "--- anciennes options ---"
          ! grep -n 'android.useDeprecatedNdk' gradle.properties
          ! grep -nE '^\s*repositories\s*\{' app/build.gradle
          ! grep -nE '^\s*dexOptions\s*\{' app/build.gradle
          echo "Nettoyage OK."

      - name: Vérifier Navigation SDK 7.9.0
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo "--- Navigation SDK ---"
          grep -nE 'navSdkVersion.*7\.9\.0' app/build.gradle
          grep -n 'com.google.android.libraries.navigation:navigation:' app/build.gradle

          if ! grep -Eq 'navSdkVersion[[:space:]]*=[[:space:]]*[\"'\'' ]*7\.9\.0' app/build.gradle; then
            echo "ERREUR : version Navigation SDK 7.9.0 non détectée."
            exit 1
          fi

          if ! grep -q 'com.google.android.libraries.navigation:navigation:' app/build.gradle; then
            echo "ERREUR : dépendance Navigation SDK absente."
            exit 1
          fi

          if grep -q 'play-services-maps' app/build.gradle; then
            echo "ERREUR : play-services-maps ne doit pas être utilisé directement."
            exit 1
          fi

          echo "Navigation SDK 7.9.0 OK."

      - name: Vérifier Android SDK 36
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          grep -q 'compileSdk 36' app/build.gradle
          grep -q 'targetSdk 36' app/build.gradle
          echo "compileSdk 36 / targetSdk 36 OK."

      - name: Injecter la clé Google Maps
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path('app/src/main/AndroidManifest.xml')
          if not p.exists():
              raise SystemExit('ERREUR : AndroidManifest.xml introuvable.')

          s = p.read_text(encoding='utf-8')
          s = s.replace('${MAPS_API_KEY}', os.environ['GOOGLE_MAPS_API_KEY'])
          p.write_text(s, encoding='utf-8')
          print('Clé Google Maps injectée.')
          PY

      - name: Vérifier Android Auto
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          test -f app/src/main/res/xml/automotive_app_desc.xml
          grep -q 'androidx.car.app.category.NAVIGATION' app/src/main/AndroidManifest.xml
          grep -q 'com.google.android.gms.car.application' app/src/main/AndroidManifest.xml
          echo "Android Auto OK."

      - name: Construire APK debug
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Vérifier APK et SHA-1
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)
          test -n "$APK"
          echo "APK généré : $APK"
          keytool -printcert -jarfile "$APK" || true

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-7.9-Navigation-AndroidAuto-FIX4
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
