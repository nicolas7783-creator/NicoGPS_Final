name: NicoGPS - Navigation SDK 7.9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Verifier la cle Google
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e

          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "ERREUR : secret GOOGLE_MAPS_API_KEY absent"
            exit 1
          fi

          echo "Cle Google detectee."

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Trouver le source NicoGPS 6.2.1
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -iname "*6.2.1*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun ZIP 6.2.1 trouve."
            echo ""
            echo "ZIP disponibles :"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "Source selectionnee : $ZIP"

          mkdir -p _nicogps_source

          unzip -q "$ZIP" -d _nicogps_source

          echo "Source extraite."

      - name: Trouver le projet Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find _nicogps_source -type f -name "settings.gradle" -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find _nicogps_source -type f -name "settings.gradle.kts" -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : aucun settings.gradle trouve."
            echo ""
            echo "Fichiers trouves dans le source :"
            find _nicogps_source -type f | head -100
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo "Projet Android : $ROOT"

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verifier la structure Android
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "=== Structure du projet ==="

          find . -maxdepth 3 -type f | sort | head -150

          echo ""

          if [ ! -f "app/build.gradle" ]; then
            echo "ERREUR : app/build.gradle introuvable."
            exit 1
          fi

          echo "app/build.gradle trouve."

      - name: Activer AndroidX
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          touch gradle.properties

          if grep -q "^android.useAndroidX=" gradle.properties; then
            sed -i "s/^android.useAndroidX=.*/android.useAndroidX=true/" gradle.properties
          else
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if grep -q "^android.enableJetifier=" gradle.properties; then
            sed -i "s/^android.enableJetifier=.*/android.enableJetifier=true/" gradle.properties
          else
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          echo "=== AndroidX active ==="
          cat gradle.properties

      - name: Migrer vers Navigation SDK 7.9.0
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          APP_GRADLE="app/build.gradle"

          echo "Fichier Gradle : $APP_GRADLE"

          echo ""
          echo "=== Dependances avant migration ==="

          grep -n "play-services-maps" "$APP_GRADLE" || true
          grep -n "navigation:" "$APP_GRADLE" || true

          echo ""
          echo "Suppression de Google Maps SDK direct..."

          sed -i "/play-services-maps/d" "$APP_GRADLE"

          echo "Ajout de Navigation SDK 7.9.0..."

          if ! grep -q "com.google.android.libraries.navigation:navigation" "$APP_GRADLE"; then
            sed -i "/dependencies[[:space:]]*{/a\    implementation 'com.google.android.libraries.navigation:navigation:7.9.0'" "$APP_GRADLE"
          fi

          echo ""
          echo "=== Dependances apres migration ==="

          grep -n "navigation:" "$APP_GRADLE" || true
          grep -n "play-services-maps" "$APP_GRADLE" || true

          if grep -q "play-services-maps" "$APP_GRADLE"; then
            echo "ERREUR : play-services-maps est encore present."
            exit 1
          fi

          if ! grep -q "com.google.android.libraries.navigation:navigation:7.9.0" "$APP_GRADLE"; then
            echo "ERREUR : Navigation SDK 7.9.0 n'a pas ete ajoute."
            exit 1
          fi

          echo ""
          echo "Migration Navigation SDK OK."

      - name: Configurer Java 17
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          APP_GRADLE="app/build.gradle"

          if ! grep -q "sourceCompatibility" "$APP_GRADLE"; then
            sed -i '/android[[:space:]]*{/a\
              compileOptions {\
                  sourceCompatibility JavaVersion.VERSION_17\
                  targetCompatibility JavaVersion.VERSION_17\
              }' "$APP_GR
