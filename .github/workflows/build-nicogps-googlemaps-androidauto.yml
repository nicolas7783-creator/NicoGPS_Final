name: Construire NicoGPS 7.9 Navigation Google Android Auto FIX5

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GOOGLE_MAPS_API_KEY: "${{ secrets.GOOGLE_MAPS_API_KEY }}"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Vérifier la clé Google Maps
        run: |
          test -n "$GOOGLE_MAPS_API_KEY" || { echo "ERREUR : secret GOOGLE_MAPS_API_KEY absent."; exit 1; }
          echo "Clé Google Maps détectée."

      - name: Trouver la source FIX2
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 5 -type f -name 'NicoGPS_FULL_7.9_GOOGLE_NAVIGATION_ANDROID_AUTO_FIX2.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERREUR : source FIX2 introuvable."
            find . -type f -name '*.zip' -print
            exit 1
          fi
          rm -rf build-source
          mkdir build-source
          unzip -q "$ZIP" -d build-source
          echo "Source : $ZIP"

      - name: Normaliser le projet
        shell: bash
        run: |
          if [ -f build-source/settings.gradle ]; then exit 0; fi
          SETTINGS=$(find build-source -mindepth 2 -maxdepth 5 -type f -name 'settings.gradle' -print -quit)
          test -n "$SETTINGS" || { echo "ERREUR : settings.gradle introuvable."; exit 1; }
          ROOT=$(dirname "$SETTINGS")
          shopt -s dotglob
          cp -a "$ROOT"/. build-source/

      - name: Nettoyer les anciennes options Gradle
        working-directory: build-source
        shell: bash
        run: |
          touch gradle.properties
          sed -i '/^[[:space:]]*android\.useDeprecatedNdk[[:space:]]*=/d' gradle.properties
          grep -q '^android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -q '^android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'(?ms)^\s*dexOptions\s*\{.*?^\s*\}\s*\n', '\n', s, count=1)
          s=re.sub(r'(?ms)^repositories\s*\{\s*google\(\)\s*\}\s*\n', '\n', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
          ! grep -q 'android.useDeprecatedNdk' gradle.properties
          ! grep -qE '^repositories[[:space:]]*\{' app/build.gradle
          ! grep -qE '^\s*dexOptions[[:space:]]*\{' app/build.gradle
          echo "Anciennes options supprimées."

      - name: Vérifier Navigation SDK 7.9.0
        working-directory: build-source
        shell: bash
        run: |
          grep -Eq 'navSdkVersion[[:space:]]*=[[:space:]]*["'"']7\.9\.0["'"']' app/build.gradle || { echo "ERREUR : Navigation SDK 7.9.0 absent."; exit 1; }
          grep -q 'com.google.android.libraries.navigation:navigation:' app/build.gradle || { echo "ERREUR : dépendance Navigation SDK absente."; exit 1; }
          ! grep -q 'play-services-maps' app/build.gradle || { echo "ERREUR : play-services-maps présent."; exit 1; }
          echo "Navigation SDK 7.9.0 OK."

      - name: Vérifier Android SDK 36
        working-directory: build-source
        run: |
          grep -q 'compileSdk 36' app/build.gradle
          grep -q 'targetSdk 36' app/build.gradle
          echo "Android SDK 36 OK."

      - name: Injecter la clé Google Maps
        working-directory: build-source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('${MAPS_API_KEY}', os.environ['GOOGLE_MAPS_API_KEY'])
          p.write_text(s, encoding='utf-8')
          PY
          echo "Clé injectée."

      - name: Vérifier Android Auto
        working-directory: build-source
        run: |
          test -f app/src/main/res/xml/automotive_app_desc.xml
          grep -q 'androidx.car.app.category.NAVIGATION' app/src/main/AndroidManifest.xml
          grep -q 'com.google.android.gms.car.application' app/src/main/AndroidManifest.xml
          grep -q 'NavigationViewForAuto' app/src/main/java/com/nicogps/app/NicoGPSCarService.java
          echo "Android Auto OK."

      - name: Construire APK debug
        working-directory: build-source
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Vérifier APK et SHA-1
        working-directory: build-source
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)
          test -n "$APK" || { echo "ERREUR : APK introuvable."; exit 1; }
          echo "APK généré : $APK"
          keytool -printcert -jarfile "$APK" || true

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-7.9-Navigation-AndroidAuto-FIX5
          path: build-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
