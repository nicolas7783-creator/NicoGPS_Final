name: Construire NicoGPS 6.1 - Recherche

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Vérifier le projet
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          echo "Projet NicoGPS trouvé."

      - name: Construire NicoGPS 6.1
        run: |
          gradle assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-6.1-search-fixed
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
