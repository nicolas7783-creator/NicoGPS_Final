name: Construire NicoGPS 6.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Trouver et extraire NicoGPS 6.3
        run: |
          set -e
          ZIP=$(find . -type f -name 'NicoGPS_6.3_source_AndroidAuto.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : ZIP NicoGPS 6.3 introuvable."
            exit 1
          fi

          mkdir -p nicogps_source
          unzip -o "$ZIP" -d nicogps_source

      - name: Trouver le projet Android
        run: |
          set -e
          PROJECT=$(find nicogps_source -name settings.gradle | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERREUR : projet Android introuvable."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurer AndroidX
        run: |
          cd "$PROJECT_DIR"
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Construire NicoGPS 6.3
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Afficher le SHA-1
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Publier l'APK NicoGPS 6.3
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-6.3
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
