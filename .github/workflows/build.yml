name: Construire NicoGPS 6.2.1 - Google Maps FINAL

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Trouver la source NicoGPS 6.2.1
        run: |
          set -e

          ZIP=$(find . -type f \
            -iname 'NicoGPS6.2.1_GoogleMaps_fix_build.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : fichier NicoGPS6.2.1_GoogleMaps_fix_build.zip introuvable."
            find . -maxdepth 5 -type f
            exit 1
          fi

          echo "SOURCE TROUVÉE : $ZIP"

          mkdir -p nicogps_source
          unzip -o "$ZIP" -d nicogps_source

      - name: Trouver le projet Android
        run: |
          set -e

          PROJECT=$(find nicogps_source -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERREUR : projet Android introuvable."
            find nicogps_source -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Projet trouvé : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurer AndroidX
        run: |
          cd "$PROJECT_DIR"

          touch gradle.properties

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Vérifier la clé Google Maps
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e

          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "ERREUR : GOOGLE_MAPS_API_KEY est vide."
            exit 1
          fi

          echo "Clé Google Maps détectée."

      - name: Construire NicoGPS 6.2.1
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Construction de NicoGPS 6.2.1..."

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew assembleDebug \
              -PMAPS_API_KEY="$MAPS_API_KEY" \
              --no-daemon
          else
            gradle assembleDebug \
              -PMAPS_API_KEY="$MAPS_API_KEY" \
              --no-daemon
          fi

      - name: Afficher le certificat SHA-1 de l'APK
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          echo "========================================"
          echo "CERTIFICAT DE L'APK NICO GPS"
          echo "========================================"

          APKSIGNER=$(find "$ANDROID_HOME" -type f \
            -name 'apksigner' \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERREUR : apksigner introuvable."
            exit 1
          fi

          echo "Outil utilisé : $APKSIGNER"
          echo ""

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo ""
          echo "========================================"
          echo "FIN DU CERTIFICAT"
          echo "========================================"

      - name: Publier l'APK NicoGPS 6.2.1
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-6.2.1-Google-Maps-FINAL
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
