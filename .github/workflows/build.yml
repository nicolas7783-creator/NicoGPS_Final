name: Construire NicoGPS 6.1 - Recherche

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Trouver et décompresser le projet NicoGPS
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname 'NicoGPS6.1*source*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun ZIP source NicoGPS 6.1 trouvé."
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"

          mkdir -p nicogps_source
          unzip -o "$ZIP" -d nicogps_source

          echo "Contenu extrait :"
          find nicogps_source -maxdepth 4 -type f | head -100

      - name: Trouver le projet Android
        run: |
          set -e

          PROJECT=$(find nicogps_source -type f -name 'settings.gradle' -o -name 'settings.gradle.kts' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERREUR : aucun projet Android trouvé."
            find nicogps_source -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Projet trouvé dans : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurer AndroidX
        run: |
          cd "$PROJECT_DIR"

          touch gradle.properties

          grep
