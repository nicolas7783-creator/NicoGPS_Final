name: Construire NicoGPS 3.1

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Préparer le projet Android
        run: |
          rm -rf source
          unzip -q NicoGPS2_source.zip -d source
          cp -r source/NicoGPS2/. .

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Construire NicoGPS 3.1
        run: |
          gradle assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-3.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
