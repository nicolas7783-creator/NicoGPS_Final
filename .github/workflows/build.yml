name: Construire NicoGPS 6.1 - Recherche

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Trouver et décompresser le projet NicoGPS
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname '*6.1*source*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun ZIP source 6.1 trouvé."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"

          mkdir -p nicogps_source
          unzip -o "$ZIP" -d nicogps_source

      - name: Définir le projet Android
        run: |
          set -e

          PROJECT_DIR="nicogps_source/NicoGPS5"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERREUR : settings.gradle introuvable."
            echo "Contenu du dossier :"
            find nicogps_source -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERREUR : app/build.gradle introuvable."
            exit 1
          fi

          echo "Projet trouvé : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurer AndroidX
        run: |
          cd "$PROJECT_DIR"

          touch gradle.properties

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          echo "Configuration AndroidX :"
          cat gradle.properties

      - name: Construire NicoGPS 6.1
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-6.1-search-fixed
          path: nicogps_source/NicoGPS5/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
