      - name: Construire NicoGPS 6.2.1
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Construction de NicoGPS 6.2.1..."

          if [ -z "$MAPS_API_KEY" ]; then
            echo "ERREUR : MAPS_API_KEY est vide."
            exit 1
          fi

          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERREUR : AndroidManifest.xml introuvable."
            exit 1
          fi

          echo "Manifeste trouvé : $MANIFEST"

          python3 - <<'PY'
          import os
          import re

          manifest = "app/src/main/AndroidManifest.xml"
          api_key = os.environ["MAPS_API_KEY"]

          with open(manifest, "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(
              r'\s*<meta-data\s+android:name="com\.google\.android\.geo\.API_KEY"[^>]*/>',
              '',
              content
          )

          content = re.sub(
              r'\s*<meta-data\s+android:name="com\.google\.android\.maps\.v2\.API_KEY"[^>]*/>',
              '',
              content
          )

          meta = (
              '        <meta-data\n'
              '            android:name="com.google.android.geo.API_KEY"\n'
              f'            android:value="{api_key}" />\n'
          )

          if "</application>" not in content:
              raise SystemExit("ERREUR : balise </application> introuvable.")

          content = content.replace(
              "</application>",
              meta + "    </application>",
              1
          )

          with open(manifest, "w", encoding="utf-8") as f:
              f.write(content)

          print("Clé Google Maps injectée dans le manifeste.")
          PY

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi
