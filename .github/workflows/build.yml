name: Construire NicoGPS 6.3.4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Trouver et extraire NicoGPS 6.3.4
        run: |
          set -e

          ZIP=$(find . -type f -name 'NicoGPS_6.3.4_AndroidAuto_FINAL_v2.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : ZIP NicoGPS 6.3.4 introuvable."
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "SOURCE TROUVEE : $ZIP"

          mkdir -p nicogps_source
          unzip -o "$ZIP" -d nicogps_source

      - name: Trouver le projet Android
        run: |
          set -e

          PROJECT=$(find nicogps_source -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERREUR : projet Android introuvable."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Projet trouve : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurer AndroidX
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch gradle.properties

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Verifier la cle Google Maps
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e

          if [ -z "$MAPS_API_KEY" ]; then
            echo "ERREUR : GOOGLE_MAPS_API_KEY est vide."
            exit 1
          fi

          echo "Cle Google Maps detectee."

      - name: Injecter la cle Google Maps
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERREUR : AndroidManifest.xml introuvable."
            exit 1
          fi

          python3 - <<'PY'
          import os
          import re

          manifest = "app/src/main/AndroidManifest.xml"
          api_key = os.environ["MAPS_API_KEY"]

          with open(manifest, "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(
              r'\s*<meta-data\s+android:name="com\.google\.android\.geo\.API_KEY"[^>]*/>',
              '',
              content
          )

          content = re.sub(
              r'\s*<meta-data\s+android:name="com\.google\.android\.maps\.v2\.API_KEY"[^>]*/>',
              '',
              content
          )

          meta = (
              '        <meta-data\n'
              '            android:name="com.google.android.geo.API_KEY"\n'
              f'            android:value="{api_key}" />\n'
          )

          if "</application>" not in content:
              raise SystemExit(
                  "ERREUR : balise </application> introuvable."
              )

          content = content.replace(
              "</application>",
              meta + "    </application>",
              1
          )

          with open(manifest, "w", encoding="utf-8") as f:
              f.write(content)

          print("Cle Google Maps injectee dans le manifeste.")
          PY

      - name: Construire NicoGPS 6.3.4
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "CONSTRUCTION DE NICOGPS 6.3.4"
          echo "=========================================="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Verifier l APK
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          echo "APK TROUVE : $APK"
          ls -lh "$APK"

      - name: Afficher le SHA-1
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERREUR : apksigner introuvable."
            exit 1
          fi

          echo "=========================================="
          echo "SHA-1 DU CERTIFICAT NICOGPS 6.3.4"
          echo "=========================================="

          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Publier l APK NicoGPS 6.3.4
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-6.3.4-AndroidAuto
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
