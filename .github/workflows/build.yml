<?xml version="1.0" encoding="utf-8"?>
<FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:background="#EAF0F5">

    <org.osmdroid.views.MapView
        android:id="@+id/map"
        android:layout_width="match_parent"
        android:layout_height="match_parent" />

    <!-- PROCHAINE MANŒUVRE -->
    <LinearLayout
        android:id="@+id/turnCard"
        android:layout_width="match_parent"
        android:layout_height="96dp"
        android:layout_gravity="top"
        android:background="#F9000000"
        android:elevation="14dp"
        android:gravity="center_vertical"
        android:orientation="horizontal"
        android:paddingStart="16dp"
        android:paddingEnd="18dp"
        android:visibility="gone">

        <TextView
            android:id="@+id/turnIcon"
            android:layout_width="70dp"
            android:layout_height="70dp"
            android:gravity="center"
            android:text="➜"
            android:textColor="#FFFFFFFF"
            android:textSize="48sp"
            android:textStyle="bold" />

        <LinearLayout
            android:layout_width="0dp"
            android:layout_height="wrap_content"
            android:layout_weight="1"
            android:orientation="vertical"
            android:paddingStart="8dp">

            <TextView
                android:id="@+id/turnDistance"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="350 m"
                android:textColor="#FFFFFFFF"
                android:textSize="29sp"
                android:textStyle="bold" />

            <TextView
                android:id="@+id/turnText"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Avenue Patton"
                android:textColor="#29B6F6"
                android:textSize="22sp"
                android:textStyle="bold" />
        </LinearLayout>
    </LinearLayout>

    <!-- BOUTON RECENTRAGE -->
    <ImageButton
        android:id="@+id/center"
        android:layout_width="64dp"
        android:layout_height="64dp"
        android:layout_gravity="top|start"
        android:layout_marginStart="18dp"
        android:layout_marginTop="112dp"
        android:background="@drawable/bg_round_black"
        android:contentDescription="Recentrer la carte"
        android:elevation="12dp"
        android:src="@android:drawable/ic_menu_compass"
        android:tint="#FFFFFFFF" />

    <!-- SON -->
    <LinearLayout
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:layout_gravity="top|end"
        android:layout_marginTop="112dp"
        android:layout_marginEnd="18dp"
        android:orientation="vertical">

        <ImageButton
            android:id="@+id/sound"
            android:layout_width="64dp"
            android:layout_height="64dp"
            android:background="@drawable/bg_round_black"
            android:contentDescription="Activer le son"
            android:elevation="12dp"
            android:src="@android:drawable/ic_lock_silent_mode_off"
            android:tint="#FFFFFFFF" />

        <ImageButton
            android:id="@+id/mute"
            android:layout_width="64dp"
            android:layout_height="64dp"
            android:layout_marginTop="14dp"
            android:background="@drawable/bg_round_black"
            android:contentDescription="Couper le son"
            android:elevation="12dp"
            android:src="@android:drawable/ic_lock_silent_mode"
            android:tint="#FFFFFFFF" />
    </LinearLayout>

    <!-- ALERTE -->
    <ImageButton
        android:id="@+id/alert"
        android:layout_width="76dp"
        android:layout_height="76dp"
        android:layout_gravity="center_vertical|end"
        android:layout_marginEnd="18dp"
        android:background="@drawable/bg_alert_day"
        android:contentDescription="Ajouter une alerte"
        android:elevation="14dp"
        android:src="@android:drawable/ic_input_add"
        android:tint="#111111" />

    <!-- COMPTEUR DE VITESSE -->
    <LinearLayout
        android:id="@+id/speedCard"
        android:layout_width="94dp"
        android:layout_height="94dp"
        android:layout_gravity="bottom|start"
        android:layout_marginStart="22dp"
        android:layout_marginBottom="118dp"
        android:background="@drawable/bg_speed_day"
        android:elevation="14dp"
        android:gravity="center"
        android:orientation="vertical">

        <TextView
            android:id="@+id/speedText"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="0"
            android:textColor="#FFFFFFFF"
            android:textSize="25sp"
            android:textStyle="bold" />

        <TextView
            android:id="@+id/limitText"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="km/h"
            android:textColor="#FFFFFFFF"
            android:textSize="12sp" />
    </LinearLayout>

    <!-- NOM DE LA ROUTE -->
    <TextView
        android:id="@+id/roadName"
        android:layout_width="wrap_content"
        android:layout_height="54dp"
        android:layout_gravity="bottom|center_horizontal"
        android:layout_marginBottom="128dp"
        android:background="@drawable/bg_road_pill"
        android:elevation="14dp"
        android:gravity="center"
        android:maxLines="2"
        android:paddingStart="28dp"
        android:paddingEnd="28dp"
        android:text="Navigation active"
        android:textColor="#FFFFFFFF"
        android:textSize="18sp"
        android:textStyle="bold"
        android:visibility="gone" />

    <!-- PANNEAU INFÉRIEUR -->
    <LinearLayout
        android:id="@+id/tripCard"
        android:layout_width="match_parent"
        android:layout_height="112dp"
        android:layout_gravity="bottom"
        android:background="#F914171A"
        android:elevation="16dp"
        android:gravity="center_vertical"
        android:orientation="horizontal"
        android:paddingStart="18dp"
        android:paddingEnd="18dp">

        <!-- RECHERCHE -->
        <ImageButton
            android:id="@+id/search"
            android:layout_width="58dp"
            android:layout_height="58dp"
            android:background="@drawable/bg_round_gray"
            android:contentDescription="Rechercher une destination"
            android:src="@android:drawable/ic_menu_search"
            android:tint="#FFFFFFFF" />

        <!-- DURÉE / DISTANCE -->
        <LinearLayout
            android:layout_width="0dp"
            android:layout_height="wrap_content"
            android:layout_weight="1"
            android:gravity="center"
            android:orientation="vertical">

            <TextView
                android:id="@+id/eta"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
