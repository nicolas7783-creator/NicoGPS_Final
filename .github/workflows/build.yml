      - name: Construire NicoGPS 6.2.1
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Construction de NicoGPS 6.2.1..."

          # Vérifier que la clé existe sans jamais l'afficher
          if [ -z "$MAPS_API_KEY" ]; then
            echo "ERREUR : MAPS_API_KEY est vide."
            exit 1
          fi

          echo "Clé Google Maps détectée."

          # Injecter explicitement la clé dans le manifeste
          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERREUR : AndroidManifest.xml introuvable."
            exit 1
          fi

          echo "Manifeste trouvé : $MANIFEST"

          # Remplacer une éventuelle ancienne déclaration Google Maps
          sed -i '/com.google.android.geo.API_KEY/d' "$MANIFEST"
          sed -i '/com.google.android.maps.v2.API_KEY/d' "$MANIFEST"

          # Ajouter la clé Google Maps dans <application>
          sed -i "/<application/r /dev/stdin" "$MANIFEST" <<EOF
              <meta-data
                  android:name="com.google.android.geo.API_KEY"
                  android:value="$MAPS_API_KEY" />
          EOF

          echo "Clé injectée dans AndroidManifest.xml."

          # Construire l'APK
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi
