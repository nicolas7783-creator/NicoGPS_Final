name: Construire NicoGPS 6.3.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Trouver et extraire NicoGPS 6.3.2
        run: |
          set -e

          ZIP=$(find . -type f \
            -name 'NicoGPS_6.3.2_AndroidAuto_FINAL.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : ZIP NicoGPS 6.3.2 introuvable."
            echo "Fichiers disponibles :"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "SOURCE TROUVEE : $ZIP"

          mkdir -p nicogps_source
          unzip -o "$ZIP" -d nicogps_source

      - name: Trouver le projet Android
        run: |
          set -e

          PROJECT=$(find nicogps_source -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERREUR : projet Android introuvable."
            find nicogps_source -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Projet trouve : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurer AndroidX
        run: |
          cd "$PROJECT_DIR"

          touch gradle.properties

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Configurer la cle Google Maps
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e

          if [ -z "$MAPS_API_KEY" ]; then
            echo "ERREUR : GOOGLE_MAPS_API_KEY est vide."
            exit 1
          fi

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import re

          path = "app/build.gradle"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          if "manifestPlaceholders" not in content:
              pattern = r'(defaultConfig\s*\{)'

              replacement = r'''\1
                  manifestPlaceholders = [
                      MAPS_API_KEY: System.getenv("MAPS_API_KEY")
                  ]
              '''

              content, count = re.subn(
                  pattern,
                  replacement,
                  content,
                  count=1
              )

              if count == 0:
                  raise SystemExit(
                      "ERREUR : bloc defaultConfig introuvable."
                  )

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

              print("manifestPlaceholders ajoute.")
          else:
              print("manifestPlaceholders deja present.")

          PY

          echo "Cle Google Maps configuree."

      - name: Construire NicoGPS 6.3.2
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "CONSTRUCTION DE NICOGPS 6.3.2"
          echo "=========================================="

          gradle assembleDebug --no-daemon

      - name: Verifier que l'APK existe
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          echo "APK trouve : $APK"
          ls -lh "$APK"

      - name: Afficher le SHA-1
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          echo "=========================================="
          echo "SHA-1 DU CERTIFICAT NICOGPS 6.3.2"
          echo "=========================================="

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "=========================================="

      - name: Publier l'APK NicoGPS 6.3.2
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-6.3.2-AndroidAuto
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
