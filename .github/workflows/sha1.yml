name: Recuperer SHA-1 NicoGPS

on:
  workflow_dispatch:

jobs:
  sha1:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Trouver la source NicoGPS
        run: |
          set -e

          ZIP=$(find . -type f \
            -iname 'NicoGPS6.2.1_GoogleMaps_fix_build.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : fichier NicoGPS6.2.1_GoogleMaps_fix_build.zip introuvable."
            find . -maxdepth 5 -type f
            exit 1
          fi

          echo "SOURCE TROUVEE : $ZIP"

          mkdir -p nicogps_source
          unzip -o "$ZIP" -d nicogps_source

      - name: Trouver le projet Android
        run: |
          set -e

          PROJECT=$(find nicogps_source -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERREUR : projet Android introuvable."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Projet : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Recuperer le SHA-1
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "SHA-1 DU CERTIFICAT NICO GPS"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew signingReport --no-daemon
          else
            gradle signingReport --no-daemon
          fi

      - name: Construire APK debug
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Verifier le certificat de l APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/app/build/outputs/apk/debug/*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          echo "======================================"
          echo "CERTIFICAT DE L APK REELLEMENT CONSTRUIT"
          echo "======================================"

          keytool -printcert -jarfile "$APK"

          echo "======================================"
          echo "FIN"
          echo "======================================"
