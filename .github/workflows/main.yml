name: Construire NicoGPS 6.2.4 Android Auto FIX6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Trouver le ZIP NicoGPS Android Auto
        shell: bash
        run: |
          set -e

          echo "Recherche du ZIP Android Auto..."

          ZIP=$(find . -type f -iname 'NicoGPS_6.3.3_AndroidAuto_FINAL.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -type f -iname '*AndroidAuto*.zip' | head -n 1)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun ZIP Android Auto trouvé."
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "ZIP sélectionné : $ZIP"

          mkdir -p nicogps-build

          unzip -o "$ZIP" -d nicogps-build

          echo "Contenu extrait :"
          find nicogps-build -maxdepth 5 -type f | head -100

      - name: Trouver le projet Android
        shell: bash
        run: |
          set -e

          APP_GRADLE=$(find nicogps-build -type f -path '*/app/build.gradle' | head -n 1)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERREUR : app/build.gradle introuvable."
            find nicogps-build -type f -name 'build.gradle' -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          echo "Projet Android trouvé : $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Activer AndroidX
        shell: bash
        run: |
          set -e

          PROPERTIES="$PROJECT_DIR/gradle.properties"

          touch "$PROPERTIES"

          grep -q '^android.useAndroidX=true' "$PROPERTIES" || \
            echo 'android.useAndroidX=true' >> "$PROPERTIES"

          grep -q '^android.enableJetifier=true' "$PROPERTIES" || \
            echo 'android.enableJetifier=true' >> "$PROPERTIES"

          echo "gradle.properties configuré."

      - name: Vérifier et corriger Android Auto
        shell: bash
        run: |
          set -e

          SERVICE=$(find "$PROJECT_DIR" -type f \( \
            -name '*CarService.java' -o \
            -name '*CarAppService.java' \
          \) | head -n 1)

          if [ -z "$SERVICE" ]; then
            echo "ERREUR : service Android Auto introuvable."
            find "$PROJECT_DIR" -type f -name '*.java' | grep -i car || true
            exit 1
          fi

          echo "Service Android Auto trouvé : $SERVICE"

          echo "----- AVANT CORRECTION -----"
          cat "$SERVICE"

          python3 - "$SERVICE" <<'PY'
          import sys
          from pathlib import Path

          fichier = Path(sys.argv[1])
          texte = fichier.read_text(encoding="utf-8")

          if "HostValidator.ALLOW_ALL_HOSTS_VALIDATOR" in texte:
              print("ALLOW_ALL_HOSTS_VALIDATOR déjà présent.")
          else:
              import re

              methode = r'''
              @Override
              @androidx.annotation.NonNull
              public androidx.car.app.validation.HostValidator createHostValidator() {
                  return androidx.car.app.validation.HostValidator.ALLOW_ALL_HOSTS_VALIDATOR;
              }
              '''

              motif = r'(\n\s*}\s*)$'

              match = re.search(motif, texte)

              if not match:
                  print("ERREUR : impossible de trouver la fin du service.")
                  sys.exit(1)

              texte = texte[:match.start()] + methode + texte[match.start():]

              fichier.write_text(texte, encoding="utf-8")

              print("createHostValidator() ajouté.")

          PY

          echo "----- APRÈS CORRECTION -----"
          cat "$SERVICE"

          echo "Vérification HostValidator..."

          if ! grep -q 'ALLOW_ALL_HOSTS_VALIDATOR' "$SERVICE"; then
            echo "ERREUR : HostValidator non configuré."
            exit 1
          fi

          echo "HostValidator Android Auto : OK."

      - name: Vérifier le Manifest Android Auto
        shell: bash
        run: |
          set -e

          MANIFEST=$(find "$PROJECT_DIR" -type f -name 'AndroidManifest.xml' | head -n 1)

          if [ -z "$MANIFEST" ]; then
            echo "ERREUR : AndroidManifest.xml introuvable."
            exit 1
          fi

          echo "Manifest : $MANIFEST"

          if ! grep -q 'androidx.car.app.CarAppService' "$MANIFEST"; then
            echo "ERREUR : CarAppService absent."
            exit 1
          fi

          if ! grep -q 'androidx.car.app.category.NAVIGATION' "$MANIFEST"; then
            echo "ERREUR : catégorie NAVIGATION absente."
            exit 1
          fi

          if ! grep -q 'com.google.android.gms.car.application' "$MANIFEST"; then
            echo "ERREUR : déclaration Android Auto absente."
            exit 1
          fi

          echo "Manifest Android Auto : OK."

      - name: Vérifier automotive_app_desc.xml
        shell: bash
        run: |
          set -e

          DESC=$(find "$PROJECT_DIR" -type f -name 'automotive_app_desc.xml' | head -n 1)

          if [ -z "$DESC" ]; then
            echo "ERREUR : automotive_app_desc.xml introuvable."
            exit 1
          fi

          echo "Fichier trouvé : $DESC"

          if ! grep -q '<uses name="template"' "$DESC"; then
            echo "ERREUR : déclaration template absente."
            exit 1
          fi

          echo "automotive_app_desc.xml : OK."

      - name: Injecter la clé Google Maps
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e

          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "ERREUR : secret GOOGLE_MAPS_API_KEY absent."
            exit 1
          fi

          MANIFEST=$(find "$PROJECT_DIR" -type f -name 'AndroidManifest.xml' | head -n 1)

          python3 - "$MANIFEST" "$GOOGLE_MAPS_API_KEY" <<'PY'
          import sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          api_key = sys.argv[2]

          texte = manifest.read_text(encoding="utf-8")

          texte = texte.replace("${MAPS_API_KEY}", api_key)
          texte = texte.replace("${GOOGLE_MAPS_API_KEY}", api_key)

          manifest.write_text(texte, encoding="utf-8")

          print("Clé Google Maps injectée.")
          PY

      - name: Construire l'APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Construction de NicoGPS FIX6..."

          gradle :app:assembleDebug --no-daemon

          echo "BUILD OK."

      - name: Vérifier l'APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          echo "APK trouvé : $APK"

          mkdir -p resultat

          cp "$APK" \
            resultat/NicoGPS-6.2.4-AndroidAuto-FIX6.apk

      - name: Afficher le SHA-1
        shell: bash
        run: |
          set -e

          APK="resultat/NicoGPS-6.2.4-AndroidAuto-FIX6.apk"

          echo "SHA-1 du certificat APK :"

          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner verify --print-certs "$APK" || true

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-6.2.4-AndroidAuto-FIX6
          path: resultat/NicoGPS-6.2.4-AndroidAuto-FIX6.apk
          if-no-files-found: error
