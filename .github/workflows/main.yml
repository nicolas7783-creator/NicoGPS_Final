name: Construire NicoGPS 6.2.1 Google Maps Android Auto FIX7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # ---------------------------------------------------------
      # 1 — SÉLECTION STRICTE DE LA BASE 6.2.1 GOOGLE MAPS
      # ---------------------------------------------------------

      - name: Sélectionner la base NicoGPS 6.2.1 Google Maps
        shell: bash
        run: |
          set -e

          echo "Recherche EXCLUSIVE de la base 6.2.1 Google Maps..."

          mapfile -t ZIPS < <(
            find . -type f \
            -iname 'NicoGPS6.2.1_GoogleMap*.zip' \
            -o -iname 'NicoGPS_6.2.1_GoogleMap*.zip'
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERREUR : aucun ZIP 6.2.1 Google Maps trouvé."
            echo
            echo "ZIP disponibles :"
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "ZIP 6.2.1 trouvé(s) :"

          for ZIP in "${ZIPS[@]}"; do
            echo " - $ZIP"
          done

          ZIP="${ZIPS[0]}"

          echo
          echo "BASE SÉLECTIONNÉE : $ZIP"

          mkdir -p nicogps-build

          unzip -o "$ZIP" -d nicogps-build

          echo
          echo "Projet extrait."

          find nicogps-build -maxdepth 5 -type f | head -100

      # ---------------------------------------------------------
      # 2 — TROUVER LE PROJET ANDROID
      # ---------------------------------------------------------

      - name: Trouver le projet Android
        shell: bash
        run: |
          set -e

          APP_GRADLE=$(find nicogps-build \
            -type f \
            -path '*/app/build.gradle' \
            | head -n 1)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERREUR : app/build.gradle introuvable."
            find nicogps-build -type f -name 'build.gradle' -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          echo "Projet Android : $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 3 — ANDROIDX
      # ---------------------------------------------------------

      - name: Activer AndroidX
        shell: bash
        run: |
          set -e

          PROPERTIES="$PROJECT_DIR/gradle.properties"

          touch "$PROPERTIES"

          grep -q '^android.useAndroidX=true' "$PROPERTIES" || \
            echo 'android.useAndroidX=true' >> "$PROPERTIES"

          grep -q '^android.enableJetifier=true' "$PROPERTIES" || \
            echo 'android.enableJetifier=true' >> "$PROPERTIES"

          echo "AndroidX configuré."

      # ---------------------------------------------------------
      # 4 — NE PAS TOUCHER À MAINACTIVITY
      # ---------------------------------------------------------

      - name: Vérifier MainActivity sans modification
        shell: bash
        run: |
          set -e

          MAIN=$(find "$PROJECT_DIR" \
            -type f \
            -name 'MainActivity.java' \
            | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "ERREUR : MainActivity.java introuvable."
            exit 1
          fi

          echo "MainActivity trouvé : $MAIN"
          echo "AUCUNE MODIFICATION DE MAINACTIVITY."

      # ---------------------------------------------------------
      # 5 — TROUVER LE SERVICE ANDROID AUTO
      # ---------------------------------------------------------

      - name: Trouver le service Android Auto
        shell: bash
        run: |
          set -e

          SERVICE=$(find "$PROJECT_DIR" \
            -type f \
            \( \
              -name '*CarService.java' \
              -o \
              -name '*CarAppService.java' \
            \) \
            | head -n 1)

          if [ -z "$SERVICE" ]; then
            echo "ERREUR : aucun service Android Auto trouvé."

            echo
            echo "Fichiers contenant Car :"

            find "$PROJECT_DIR" \
              -type f \
              -name '*.java' \
              | grep -i car || true

            exit 1
          fi

          echo "Service Android Auto trouvé :"
          echo "$SERVICE"

          echo "CAR_SERVICE=$SERVICE" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 6 — CORRIGER LE HOST VALIDATOR
      # ---------------------------------------------------------

      - name: Corriger HostValidator Android Auto
        shell: bash
        run: |
          set -e

          SERVICE="$CAR_SERVICE"

          echo "Correction Android Auto dans : $SERVICE"

          python3 - "$SERVICE" <<'PY'
          import sys
          import re
          from pathlib import Path

          fichier = Path(sys.argv[1])

          texte = fichier.read_text(encoding="utf-8")

          if "ALLOW_ALL_HOSTS_VALIDATOR" in texte:
              print("HostValidator déjà présent.")
              sys.exit(0)

          methode = r'''
              @Override
              @androidx.annotation.NonNull
              public androidx.car.app.validation.HostValidator createHostValidator() {
                  return androidx.car.app.validation.HostValidator.ALLOW_ALL_HOSTS_VALIDATOR;
              }
          '''

          # Ajout juste avant la dernière accolade de la classe.
          position = texte.rfind("}")

          if position == -1:
              print("ERREUR : fin de classe introuvable.")
              sys.exit(1)

          texte = texte[:position] + methode + "\n" + texte[position:]

          fichier.write_text(texte, encoding="utf-8")

          print("HostValidator ajouté.")
          PY

          echo
          echo "Vérification..."

          if ! grep -q 'ALLOW_ALL_HOSTS_VALIDATOR' "$SERVICE"; then
            echo "ERREUR : HostValidator absent après correction."
            exit 1
          fi

          echo "HostValidator Android Auto : OK."

      # ---------------------------------------------------------
      # 7 — VÉRIFIER LE MANIFEST
      # ---------------------------------------------------------

      - name: Vérifier le Manifest Android Auto
        shell: bash
        run: |
          set -e

          MANIFEST=$(find "$PROJECT_DIR" \
            -type f \
            -name 'AndroidManifest.xml' \
            | head -n 1)

          if [ -z "$MANIFEST" ]; then
            echo "ERREUR : AndroidManifest.xml introuvable."
            exit 1
          fi

          echo "Manifest : $MANIFEST"

          if ! grep -q 'androidx.car.app.CarAppService' "$MANIFEST"; then
            echo "ERREUR : CarAppService absent."
            exit 1
          fi

          if ! grep -q 'androidx.car.app.category.NAVIGATION' "$MANIFEST"; then
            echo "ERREUR : catégorie NAVIGATION absente."
            exit 1
          fi

          if ! grep -q 'com.google.android.gms.car.application' "$MANIFEST"; then
            echo "ERREUR : déclaration Android Auto absente."
            exit 1
          fi

          echo "Manifest Android Auto : OK."

      # ---------------------------------------------------------
      # 8 — VÉRIFIER AUTOMOTIVE APP DESC
      # ---------------------------------------------------------

      - name: Vérifier automotive_app_desc
        shell: bash
        run: |
          set -e

          DESC=$(find "$PROJECT_DIR" \
            -type f \
            -name 'automotive_app_desc.xml' \
            | head -n 1)

          if [ -z "$DESC" ]; then
            echo "ERREUR : automotive_app_desc.xml introuvable."
            exit 1
          fi

          echo "Fichier : $DESC"

          if ! grep -q '<uses name="template"' "$DESC"; then
            echo "ERREUR : <uses name=\"template\" /> absent."
            exit 1
          fi

          echo "automotive_app_desc.xml : OK."

      # ---------------------------------------------------------
      # 9 — CLÉ GOOGLE MAPS
      # ---------------------------------------------------------

      - name: Injecter la clé Google Maps
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e

          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "ERREUR : GOOGLE_MAPS_API_KEY absent."
            exit 1
          fi

          MANIFEST=$(find "$PROJECT_DIR" \
            -type f \
            -name 'AndroidManifest.xml' \
            | head -n 1)

          python3 - "$MANIFEST" "$GOOGLE_MAPS_API_KEY" <<'PY'
          import sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          api_key = sys.argv[2]

          texte = manifest.read_text(encoding="utf-8")

          texte = texte.replace("${MAPS_API_KEY}", api_key)
          texte = texte.replace("${GOOGLE_MAPS_API_KEY}", api_key)

          manifest.write_text(texte, encoding="utf-8")

          print("Clé Google Maps injectée.")
          PY

      # ---------------------------------------------------------
      # 10 — CONSTRUIRE
      # ---------------------------------------------------------

      - name: Construire NicoGPS FIX7
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo " CONSTRUCTION NICO GPS FIX7"
          echo " BASE : 6.2.1 GOOGLE MAPS"
          echo " ANDROID AUTO : OUI"
          echo " MAINACTIVITY : INCHANGÉE"
          echo "======================================"

          gradle :app:assembleDebug --no-daemon

          echo
          echo "BUILD OK."

      # ---------------------------------------------------------
      # 11 — APK
      # ---------------------------------------------------------

      - name: Préparer l'APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          echo "APK trouvé : $APK"

          mkdir -p resultat

          cp "$APK" \
            resultat/NicoGPS-6.2.1-GoogleMaps-AndroidAuto-FIX7.apk

      # ---------------------------------------------------------
      # 12 — SHA-1
      # ---------------------------------------------------------

      - name: Afficher le SHA-1
        shell: bash
        run: |
          set -e

          APK="resultat/NicoGPS-6.2.1-GoogleMaps-AndroidAuto-FIX7.apk"

          echo "SHA-1 du certificat APK :"

          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner \
            verify \
            --print-certs \
            "$APK" || true

      # ---------------------------------------------------------
      # 13 — ARTIFACT
      # ---------------------------------------------------------

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-6.2.1-GoogleMaps-AndroidAuto-FIX7
          path: resultat/NicoGPS-6.2.1-GoogleMaps-AndroidAuto-FIX7.apk
          if-no-files-found: error
