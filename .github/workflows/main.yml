name: Construire NicoGPS 6.2.4 Android Auto FIX5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Trouver et décompresser le ZIP NicoGPS
        shell: bash
        run: |
          set -e

          echo "Recherche du ZIP NicoGPS..."

          ZIP=$(find . -type f -iname 'NicoGPS*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun ZIP NicoGPS trouvé."
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"

          mkdir -p nicogps-build

          unzip -o "$ZIP" -d nicogps-build

          echo "Contenu extrait :"
          find nicogps-build -maxdepth 5 -type f | head -100

      - name: Trouver le projet Android
        shell: bash
        run: |
          set -e

          APP_GRADLE=$(find nicogps-build -type f -path '*/app/build.gradle' | head -n 1)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERREUR : app/build.gradle introuvable."
            find nicogps-build -type f -name 'build.gradle' -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")

          echo "Projet Android trouvé : $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Corriger MainActivity.java
        shell: bash
        run: |
          set -e

          MAIN=$(find "$PROJECT_DIR" -type f -name 'MainActivity.java' | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "ERREUR : MainActivity.java introuvable."
            exit 1
          fi

          echo "MainActivity trouvé : $MAIN"

          python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          fichier = Path(sys.argv[1])

          texte = fichier.read_text(encoding="utf-8")

          avant = texte

          # Correction du caractère littéral \n ajouté par erreur
          # après une instruction Java.
          texte = texte.replace(";\\n", ";")

          if texte != avant:
              fichier.write_text(texte, encoding="utf-8")
              print("Correction du \\n parasite effectuée.")
          else:
              print("Aucun \\n parasite de ce type trouvé.")

          # Vérification ciblée : on ne bloque PAS les vrais \n
          # présents dans les chaînes Java.
          lignes = texte.splitlines()

          erreurs = []

          for numero, ligne in enumerate(lignes, 1):
              if '\\n' in ligne and 'setMessage' not in ligne:
                  if not ('"' in ligne and ligne.rfind('"') > ligne.find('\\n')):
                      erreurs.append((numero, ligne))

          if erreurs:
              print("Attention : séquences \\n détectées :")
              for numero, ligne in erreurs[:10]:
                  print(f"{numero}: {ligne}")
          else:
              print("Aucun caractère \\n illégal détecté.")

          print("MainActivity.java OK.")
          PY

      - name: Activer AndroidX
        shell: bash
        run: |
          set -e

          PROPERTIES="$PROJECT_DIR/gradle.properties"

          touch "$PROPERTIES"

          grep -q '^android.useAndroidX=true' "$PROPERTIES" || \
            echo 'android.useAndroidX=true' >> "$PROPERTIES"

          grep -q '^android.enableJetifier=true' "$PROPERTIES" || \
            echo 'android.enableJetifier=true' >> "$PROPERTIES"

          echo "gradle.properties configuré."

      - name: Injecter la clé Google Maps
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -e

          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "ERREUR : le secret GOOGLE_MAPS_API_KEY est absent."
            exit 1
          fi

          MANIFEST=$(find "$PROJECT_DIR" -type f -name 'AndroidManifest.xml' | head -n 1)

          if [ -z "$MANIFEST" ]; then
            echo "ERREUR : AndroidManifest.xml introuvable."
            exit 1
          fi

          echo "Manifest trouvé : $MANIFEST"

          python3 - "$MANIFEST" "$GOOGLE_MAPS_API_KEY" <<'PY'
          import sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          api_key = sys.argv[2]

          texte = manifest.read_text(encoding="utf-8")

          texte = texte.replace("${MAPS_API_KEY}", api_key)
          texte = texte.replace("${GOOGLE_MAPS_API_KEY}", api_key)

          manifest.write_text(texte, encoding="utf-8")

          print("Clé Google Maps injectée.")
          PY

      - name: Vérifier Android Auto
        shell: bash
        run: |
          set -e

          MANIFEST=$(find "$PROJECT_DIR" -type f -name 'AndroidManifest.xml' | head -n 1)

          echo "Vérification du service Android Auto..."

          if ! grep -q 'androidx.car.app.CarAppService' "$MANIFEST"; then
            echo "ERREUR : CarAppService absent du Manifest."
            exit 1
          fi

          if ! grep -q 'androidx.car.app.category.NAVIGATION' "$MANIFEST"; then
            echo "ERREUR : catégorie NAVIGATION absente du Manifest."
            exit 1
          fi

          echo "Android Auto : OK."

      - name: Construire l'APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Construction de NicoGPS..."

          gradle :app:assembleDebug --no-daemon

          echo "BUILD OK."

      - name: Vérifier l'APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          echo "APK trouvé : $APK"

          mkdir -p resultat

          cp "$APK" resultat/NicoGPS-6.2.4-AndroidAuto-FIX5.apk

      - name: Afficher le SHA-1
        shell: bash
        run: |
          set -e

          APK="resultat/NicoGPS-6.2.4-AndroidAuto-FIX5.apk"

          echo "SHA-1 du certificat APK :"

          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner verify --print-certs "$APK" || true

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoGPS-6.2.4-AndroidAuto-FIX5
          path: resultat/NicoGPS-6.2.4-AndroidAuto-FIX5.apk
          if-no-files-found: error
